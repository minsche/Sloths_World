<body><div id="hud"><h1>🦥 Sloth’s World</h1><p>Tropical greenhouse</p><span class="pill">🥭 <b id="fruit">0 / 0</b></span><span class="pill">🌀 <b id="bounce">0</b></span></div><div id="status">Loading sloth…</div><div id="help">A / D or ← / → to wander · Space to jump · Trampoline to bounce higher</div><div id="controls"><div><button data-key="left" aria-label="Left">←</button> <button data-key="right" aria-label="Right">→</button></div><button data-key="jump" aria-label="Jump">↑</button></div><div id="win">🌺 You collected every mango!<br>Enjoy the greenhouse.</div><a id="back" href="./index.html">Original 3D room</a>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a8e2fa');scene.fog=new THREE.Fog('#c5f1ed',35,78);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.32;document.body.prepend(renderer.domElement);
const camera=new THREE.OrthographicCamera(-10,10,5.5,-5.5,.1,100);const focus=new THREE.Vector3(0,3.5,0);
scene.add(new THREE.HemisphereLight('#fff8e0','#87a87c',2.3));const sun=new THREE.DirectionalLight('#fff0bf',3.2);sun.position.set(-8,13,10);scene.add(sun);
const mat=(color,roughness=.86)=>new THREE.MeshStandardMaterial({color,roughness});const wood=mat('#bc793e'),woodDark=mat('#80502c'),woodLight=mat('#ebba71'),grass=mat('#7fbd36'),grassBright=mat('#a8d84b'),earth=mat('#ba8250'),stone=mat('#8da6a4'),leafM=[mat('#328b43'),mat('#60b544'),mat('#8ec843'),mat('#167852')],flowerM=[mat('#ff6a91'),mat('#ffd14c'),mat('#f18bdf'),mat('#fc8a48')];
const group=(x=0,y=0,z=0,p=scene)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);return g};
function mesh(geo,m,x,y,z,p=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);p.add(o);return o}
function box(w,h,d,m,x,y,z,p=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p)}
function ball(rx,ry,rz,m,x,y,z,p=scene){const o=mesh(new THREE.SphereGeometry(1,16,12),m,x,y,z,p);o.scale.set(rx,ry,rz);return o}
function beam(a,b,r,m,p=scene){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const o=mesh(new THREE.CylinderGeometry(r,r,d.length(),12),m,0,0,0,p);o.position.copy(A.add(B).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}
function tube(points,r,m,p=scene){const c=new THREE.CatmullRomCurve3(points.map(v=>new THREE.Vector3(...v)));return mesh(new THREE.TubeGeometry(c,32,r,7,false),m,0,0,0,p)}
let seed=43;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const far=group(0,0,-25),mid=group(0,0,-13),back=group(0,0,-6.4);const glassFrame=mat('#c48b50'),hill=[mat('#61b59d'),mat('#459e92'),mat('#83c3a5')],cloudMat=mat('#fff9e9');
for(let i=0;i<26;i++){const x=-38+i*3.1;ball(3+rand()*4,2+rand()*5,2,hill[i%3],x,rand()*3-1,0,far)}
for(let i=0;i<12;i++){const x=-38+i*7.2,y=8+rand()*3;for(let j=0;j<4;j++)ball(1.4+rand(),.45+rand()*.35,.6,cloudMat,x+j*.8,y+rand()*.4,0,far)}
const waterfall=mat('#d0faff',.24),waterblue=mat('#62cce3',.22);
for(let i=0;i<4;i++){const x=-18+i*12;box(.65,6,.2,waterfall,x,3,.8,far);box(.19,6.2,.24,waterblue,x+.2,3,.9,far)}
for(let i=0;i<18;i++){const x=-26+i*3.15,h=2+rand()*4;beam([x,-.5,0],[x,h,0],.24,woodDark,mid);for(let j=0;j<4;j++)ball(1.3+rand(),.85+rand(),.9,leafM[(i+j)%4],x+(rand()-.5)*1.7,h+rand()*1.2,0,mid)}
// Glasshouse structure: clear panes, timber mullions, visible blue sky and distant landscape.
for(let x=-22;x<=22;x+=4){beam([x,0,0],[x,8,0],.13,glassFrame,back);beam([x,8,0],[x,10.3,2.7],.15,wood,back);beam([x,10.3,2.7],[x,8,5.4],.15,wood,back)}
for(const y of [.45,3.65,7.9])box(44,.13,.16,glassFrame,0,y,0,back);
for(const [y,z] of [[8,0],[10.3,2.7],[8,5.4]])box(44,.16,.16,wood,0,y,z,back);
function flower(x,y,z,p,size=1,index=0){const g=group(x,y,z,p);for(let k=0;k<5;k++){const a=k*Math.PI*2/5;const pet=ball(.13*size,.19*size,.06*size,flowerM[index%4],Math.sin(a)*.16*size,Math.cos(a)*.16*size,0,g);pet.rotation.z=-a}ball(.09*size,.09*size,.07*size,flowerM[1],0,0,.05,g);return g}
function plant(x,y,z,size,p=scene,flowers=true){const g=group(x,y,z,p);for(let i=0;i<6;i++){const a=i*2.4,h=(.55+rand()*.72)*size,dx=Math.sin(a)*.45*size;beam([0,0,0],[dx,h,Math.cos(a)*.22*size],.025*size,leafM[0],g);const l=ball(.24*size,.55*size,.10*size,leafM[i%4],dx,h*.99,Math.cos(a)*.23*size,g);l.rotation.z=-Math.sin(a)*.8;if(flowers&&i%2===0)flower(dx,h+.25*size,.16*size,g,.7*size,i/2)}return g}
for(let x=-19;x<=20;x+=1.8)plant(x,0,-2.65,.7+rand()*.65,scene,rand()>.35);
// Hanging baskets and trailing vines, all behind the play plane.
for(let x=-18;x<=18;x+=5.8){const b=group(x,6.3,-3.5);mesh(new THREE.CylinderGeometry(.48,.27,.35,16),wood,0,0,0,b);for(const dx of [-.35,.35])beam([dx,.12,0],[0,2,0],.025,woodLight,b);plant(0,.15,0,.75,b,true);for(let i=0;i<3;i++){const dx=(i-1)*.26;tube([[dx,0,0],[dx+.12,-.45,.05],[dx-.13,-1.1,0]],.025,leafM[1],b);for(let j=0;j<4;j++)ball(.17,.22,.08,leafM[(i+j)%4],dx+Math.sin(j)*.13,-.25-j*.25,.1,b)}}
// Walkable floor with a genuine break at each inset trampoline.
const L=-19,R=19,tramps=[-5.5,7.0],tr=1.3;
let cursor=L;for(const x of tramps){const end=x-tr;box(end-cursor,.65,4.8,earth,(cursor+end)/2,-.39,0);box(end-cursor,.16,4.8,grass,(cursor+end)/2,-.08,0);cursor=x+tr}box(R-cursor,.65,4.8,earth,(cursor+R)/2,-.39,0);box(R-cursor,.16,4.8,grass,(cursor+R)/2,-.08,0);
for(let i=0;i<75;i++){const x=L+rand()*(R-L);if(tramps.some(t=>Math.abs(x-t)<1.5))continue;const z=1.8+rand()*.45;ball(.18,.08,.1,grassBright,x,.015,z);if(i%5===0)flower(x,.13,z+.1,scene,.45,i%4)}
// Decorative stream in front of the playable strip; not a gameplay hazard.
const river=mesh(new THREE.PlaneGeometry(40,1.7),new THREE.MeshStandardMaterial({color:'#54cce0',roughness:.25,metalness:.05}),0,-.30,3.3);river.rotation.x=-Math.PI/2;
for(let i=0;i<24;i++){const x=-19+i*1.65;ball(.45+rand()*.2,.2,.31,stone,x,-.17,2.57+rand()*.2);const streak=box(.28+rand()*.66,.012,.045,waterfall,x,-.28,3.03+rand()*.8);streak.rotation.y=(rand()-.5)*.15}
for(let i=0;i<10;i++)plant(-18+i*4,.02,4.05,.55+rand()*.3,scene,true);
const trampolineM=mat('#8a50bf',.8),rimM=mat('#f2a742');const mats=[];
for(const x of tramps){const g=group(x,0,0);box(2.6,.1,2.65,woodDark,0,-.15,0,g);const m=box(2.35,.07,2.15,trampolineM,0,-.035,0,g);mats.push(m);for(const s of [-1,1]){box(.17,.11,2.5,rimM,s*1.22,-.04,0,g);box(2.3,.11,.17,rimM,0,-.04,s*1.17,g)}for(let j=0;j<5;j++){const a=j*Math.PI*2/5;const o=ball(.12,.015,.27,flowerM[2],Math.sin(a)*.18,.007,Math.cos(a)*.18,g);o.rotation.y=a}}
const platforms=[{x:-10,y:1.7,w:3.0},{x:-3.6,y:2.5,w:3.1},{x:.6,y:3.6,w:3.1},{x:8.3,y:2.5,w:3.4},{x:12.5,y:3.65,w:3.2},{x:16.8,y:4.7,w:3.4}];
for(const p of platforms){box(p.w,.35,1.9,wood,p.x,p.y-.22,0);box(p.w,.12,1.94,grass,p.x,p.y-.06,0);for(let i=0;i<Math.floor(p.w/.34);i++){const x=p.x-p.w/2+.18+i*.34;box(.025,.28,.025,woodLight,x,p.y-.20,.96)}for(const s of [-1,1]){beam([p.x+s*(p.w/2-.25),p.y-.4,-.6],[p.x+s*.25,Math.max(.1,p.y-1.6),-1.4],.10,woodDark);plant(p.x+s*(p.w/2-.28),p.y,-.75,.36,scene,true)}}
// A cosy tree nook at the start and a little floral shelter at the goal.
const tree=group(-16,0,-2.4);beam([0,0,0],[-.2,7,0],.65,wood,tree);for(const s of [-1,1]){beam([0,4.8,0],[s*2.2,6.6,0],.28,wood,tree);for(let j=0;j<5;j++)ball(1.1,.8,.75,leafM[j%4],s*(.5+j*.5),6.7+rand()*.6,0,tree)}const nook=group(-15.7,0,-1.6);ball(1.6,1.4,.65,wood,0,1.1,0,nook);ball(1.25,1.05,.25,woodDark,0,1.15,.48,nook);box(2.35,.16,.9,woodLight,0,.25,.55,nook);ball(.65,.22,.38,flowerM[0],-.4,.45,.65,nook);ball(.58,.2,.32,grassBright,.5,.45,.65,nook);
const goal=group(16.8,4.7,-.65);for(const s of [-1,1])beam([s*1.15,0,0],[s*1.15,1.55,0],.1,wood,goal);for(let i=0;i<9;i++){let x=-1.35+i*.34;box(.4,.17,.94,grass,x,1.68-.25*Math.abs(x),0,goal);flower(x,1.77-.25*Math.abs(x),.35,goal,.6,i%4)}
// Mangoes float above the landing surfaces.
const fruit=[];
function mango(x,y){const g=group(x,y,0);ball(.20,.29,.18,mat('#ffc13c'),0,0,0,g);ball(.12,.21,.16,mat('#f39a2c'),.08,-.025,.015,g);beam([0,.22,0],[.06,.34,0],.025,woodDark,g);const l=ball(.18,.065,.075,leafM[0],.14,.31,0,g);l.rotation.z=.45;fruit.push({g,x,y,taken:false})}
for(const p of platforms){mango(p.x-.55,p.y+.75);mango(p.x+.55,p.y+.75)}mango(-14,.7);mango(3,.7);mango(10,.7);
const fruitHUD=document.querySelector('#fruit');let collected=0;fruitHUD.textContent='0 / '+fruit.length;
const sloth=group(-15,0,0),bob=group(0,0,0,sloth);let mixer=null,ready=false;const status=document.querySelector('#status');
new GLTFLoader().load('./cute_sloth.glb',gltf=>{const c=gltf.scene;c.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(c),s=b.getSize(new THREE.Vector3());if(!Number.isFinite(s.y)||s.y<.001){status.textContent='Sloth model has no geometry';return}c.scale.multiplyScalar(Math.min(1.72/s.y,1.35/Math.max(s.x,s.z,.001)));c.updateMatrixWorld(true);b.setFromObject(c);const center=b.getCenter(new THREE.Vector3());c.position.set(-center.x,-b.min.y,-center.z);bob.add(c);const idle=gltf.animations.find(a=>/idle|breath|blink/i.test(a.name));if(idle){mixer=new THREE.AnimationMixer(c);mixer.clipAction(idle).play()}ready=true;status.textContent=''},undefined,()=>{status.textContent='Could not load cute_sloth.glb';});
const shadow=ball(.55,.018,.33,mat('#466b43'),-15,.018,0);shadow.material.transparent=true;shadow.material.opacity=.37;
const keys=new Set(),touch=new Set();let jumpQueued=false;function mapKey(k){return ['a','arrowleft'].includes(k)?'left':['d','arrowright'].includes(k)?'right':[' ','w','arrowup'].includes(k)?'jump':null}
addEventListener('keydown',e=>{const k=mapKey(e.key.toLowerCase());if(!k)return;e.preventDefault();if(k==='jump'&&!keys.has(k))jumpQueued=true;keys.add(k)});addEventListener('keyup',e=>{const k=mapKey(e.key.toLowerCase());if(k)keys.delete(k)});addEventListener('blur',()=>{keys.clear();touch.clear();jumpQueued=false});for(const b of document.querySelectorAll('button[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touch.add(k);if(k==='jump')jumpQueued=true});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>touch.delete(k))}
const pressed=k=>keys.has(k)||touch.has(k);let vy=0,grounded=true,bounces=0,face=1;const clock=new THREE.Clock();let camX=-13;
function resize(){const a=innerWidth/innerHeight,h=a<.8?9.2:9.4;camera.left=-h*a/2;camera.right=h*a/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
function bounce(){vy=Math.min(10.4+bounces*.25,12);grounded=false;bounces++;document.querySelector('#bounce').textContent=bounces}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.035),t=clock.elapsedTime;if(mixer)mixer.update(dt);const dir=Number(pressed('right'))-Number(pressed('left'));const oldY=sloth.position.y;sloth.position.x=THREE.MathUtils.clamp(sloth.position.x+dir*4.4*dt,L+.55,R-.55);if(dir)face=dir;const x=sloth.position.x;
if(jumpQueued&&grounded){vy=7.9;grounded=false}jumpQueued=false;
vy-=13*dt;let nextY=oldY+vy*dt;let landing=null;if(vy<=0){if(nextY<=0)landing=0;for(const p of platforms)if(x>=p.x-p.w/2+.1&&x<=p.x+p.w/2-.1&&oldY>=p.y-.025&&nextY<=p.y)landing=Math.max(landing??-Infinity,p.y)}
if(landing!==null){sloth.position.y=landing;vy=0;grounded=true;if(landing===0&&tramps.some(q=>Math.abs(x-q)<1.1))bounce()}else{sloth.position.y=Math.max(0,nextY);grounded=false}
bob.rotation.y=THREE.MathUtils.lerp(bob.rotation.y,face*.72,Math.min(1,dt*9));bob.rotation.z=grounded&&dir?Math.sin(t*10)*.04:0;bob.position.y=grounded&&dir?.035*Math.sin(t*13):0;
shadow.position.x=x;shadow.scale.setScalar(1/(1+sloth.position.y*.25));for(let i=0;i<mats.length;i++)mats[i].position.y=-.035-(Math.abs(x-tramps[i])<1.1&&sloth.position.y<.18?.012*Math.sin(t*20)**2:0);
for(const f of fruit)if(!f.taken){f.g.position.y=f.y+.10*Math.sin(t*2+f.x);f.g.rotation.y=t*.9;if(ready&&Math.hypot(f.x-x,f.g.position.y-(sloth.position.y+.68))<.65){f.taken=true;f.g.visible=false;collected++;fruitHUD.textContent=collected+' / '+fruit.length;if(collected===fruit.length)document.querySelector('#win').style.display='block'}}
const half=(camera.right-camera.left)/2,lo=L+Math.min(half,R-L),hi=R-Math.min(half,R-L);const target=lo<=hi?THREE.MathUtils.clamp(x+face*.8,lo,hi):0;camX=THREE.MathUtils.lerp(camX,target,Math.min(1,dt*3));focus.set(camX,3.65,0);camera.position.set(camX,5.5,20);camera.lookAt(focus);far.position.x=camX*.62;mid.position.x=camX*.28;renderer.render(scene,camera)}frame();
</script></body></html>
